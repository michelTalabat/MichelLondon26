<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>London Trip Planner</title>
  <link rel="stylesheet" href="styles.css">
  <script>if (window.innerWidth < 768) window.location.replace('schedule.html');</script>
</head>
<body class="planner-page">
  <nav class="navbar">
    <a href="index.html" class="nav-link active">Planner</a>
    <a href="schedule.html" class="nav-link">Schedule</a>
    <button class="nav-export" onclick="exportSchedule()">Export Schedule</button>
  </nav>

  <header class="hero">
    <div class="hero-content">
      <h1>London 2026</h1>
      <p class="hero-sub">Michel, Maryam & Raffi &mdash; June 20–27</p>
    </div>
  </header>

  <div class="day-tabs" id="dayTabs"></div>

  <main class="planner-layout">
    <div class="panel panel-available" id="availablePanel">
      <div class="panel-header">Available Places</div>
      <div id="availableList"></div>
    </div>
    <div class="panel panel-itinerary" id="itineraryPanel">
      <div class="panel-header">Your Itinerary</div>
      <div id="itineraryList"></div>
    </div>
  </main>

  <script src="planner.js"></script>
</body>
</html>
